# Azure AD app registration — delegated (single-user) auth
#
# This server signs in as ONE user via the device-code flow and can reach that
# user's mailbox plus any shared mailbox listed in `shared_mailboxes` below
# (subject to Exchange permissions). Register the app with *delegated* Graph
# permissions (not application permissions), then run `m365-mcp-server login`.
tenant_id = ""
client_id = ""

# Optional. Only set it if the registration is a confidential client; the
# device-code flow works as a public client without a secret.
# client_secret = ""

# The account this server signs in as. Any `mailbox` argument that does not
# match this address or an entry in `shared_mailboxes` is rejected.
user_email = ""

# Shared mailboxes the signed-in user has been delegated in Exchange. Graph has
# no endpoint that lists these, so they must be named here. Configuring at least
# one adds the `Mail.*.Shared` / `Calendars.*.Shared` delegated scopes, which
# requires re-running `m365-mcp-server login`. Exchange must grant the user Full
# Access (and Send As for sending) before requests succeed.
# shared_mailboxes = ["devops@example.com"]

# Where delegated access/refresh tokens are cached (mode 0600). Default:
# ~/.config/m365-mcp/tokens.json
# token_path = "~/.config/m365-mcp/tokens.json"

# Where local attachments may be read from. Anything outside this directory is
# refused, symlinks are resolved before the check. Default: ~/Downloads
# attachment_root = "~/Downloads"

# Windows timezone name sent with calendar writes (Graph's dateTimeTimeZone
# format, not IANA). Default: GMT Standard Time (Ireland/UK)
# calendar_timezone = "GMT Standard Time"

# Optional: Graph folder IDs excluded from get_recent_emails_all_folders.
# excluded_folder_ids = []

# Master on/off switch for the exclusion list above. Default: false
# skip_excluded_folders = false

# Sign-off name used in triage_email's suggested replies. Default: The Team
# signoff_name = ""

# Read-only by default: 12 read tools, write tools hidden. Set false (and grant
# the *Write delegated scopes*) to enable writes.
# read_only = true
